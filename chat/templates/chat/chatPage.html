<!DOCTYPE html>
<html>
<body>
    <center><h1>Hello, {{ request.user }}</h1></center>
    <center><a href="{% url 'logout-user' %}">Logout</a></center>
    <br>
    <div id="chat_box" style="font-size:20px"></div>
    <br>
    <input type="text" id="msg_input" />
    <button id="send_btn">Send Message</button>

    <script>
        // open the always-on connection to the server
        const chatSocket = new WebSocket("ws://" + window.location.host + "/");

        chatSocket.onopen = () => console.log("Connected!");
        chatSocket.onclose = () => console.log("Disconnected");

        // press Enter to send
        document.querySelector("#msg_input").onkeyup = function (e) {
            if (e.key === "Enter") {
                document.querySelector("#send_btn").click();
            }
        };

        // send the message when the button is clicked
        document.querySelector("#send_btn").onclick = function () {
            const message = document.querySelector("#msg_input").value;
            chatSocket.send(JSON.stringify({
                message: message,
                username: "{{ request.user.username }}"
            }));
            document.querySelector("#msg_input").value = "";
        };

        // show every incoming message on the page
        chatSocket.onmessage = function (e) {
            const data = JSON.parse(e.data);
            const div = document.createElement("div");
            div.innerText = data.username + " : " + data.message;
            document.querySelector("#chat_box").appendChild(div);
        };
    </script>
</body>
</html>
